
substitutions:
  _REGION: europe-west2
  _REPO: vibe-apps
  _SERVICE: boltbet-backend-web
  _IMAGE: boltbet-backend
  _RUNTIME_SA: vibe-app-runtime@blockchain-gemini.iam.gserviceaccount.com

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest
      - -f
      - Dockerfile
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_RUNTIME_SA}
      - --allow-unauthenticated
      - --port=8000
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=2
      - --set-env-vars=DJANGO_BEHIND_PROXY=true,DJANGO_DEBUG=false
      - --set-env-vars=DJANGO_ALLOWED_HOSTS=*
      - --set-env-vars=CORS_ALLOWED_ORIGINS=http://localhost:3000
      - --set-secrets=DJANGO_SECRET_KEY=boltbet-django-secret-key:latest
      - --set-secrets=OWM_API_KEY=boltbet-owm-api-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
