substitutions:
  _REGION: europe-west2
  _REPO: vibe-apps
  _SERVICE: boltbet-backend-web
  _IMAGE: boltbet-backend
  _RUNTIME_SA: vibe-app-runtime@blockchain-gemini.iam.gserviceaccount.com
  # Dev deployment defaults. Override these for other environments.
  _CORS_ALLOWED_ORIGINS: https://boltbet-frontend-web-2ulnbyw42a-nw.a.run.app,https://lightningmapsgame.com,https://www.lightningmapsgame.com,https://lightningmapgame.com,https://www.lightningmapgame.com
  _FIREBASE_PROJECT_ID: blockchain-gemini
  _POSTHOG_PROJECT_TOKEN: phc_wJsYdcjNAwHdBdcbJngPR6oVhdb7ksDmBp3qqAu2EKnS
  _POSTHOG_HOST: https://eu.i.posthog.com

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        test -n "${_CORS_ALLOWED_ORIGINS}" || { echo "_CORS_ALLOWED_ORIGINS is required"; exit 1; }

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest
      - -f
      - Dockerfile
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_RUNTIME_SA}
      - --allow-unauthenticated
      - --port=8000
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=1
      - --set-env-vars=^@^DJANGO_ENV=production@DJANGO_BEHIND_PROXY=true@DJANGO_DEBUG=false@DJANGO_ALLOWED_HOSTS=*@DJANGO_CSRF_TRUSTED_ORIGINS=${_CORS_ALLOWED_ORIGINS}@CORS_ALLOWED_ORIGINS=${_CORS_ALLOWED_ORIGINS}@FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}@POSTHOG_PROJECT_TOKEN=${_POSTHOG_PROJECT_TOKEN}@POSTHOG_HOST=${_POSTHOG_HOST}@RUN_INGEST_IN_PROCESS=true@RUN_PURGE_IN_PROCESS=true@RUN_TRIM_IN_PROCESS=true@RUN_RESOLVER_IN_PROCESS=true
      - --set-secrets=DJANGO_SECRET_KEY=boltbet-django-secret-key:latest,OWM_API_KEY=boltbet-owm-api-key:latest,DB_HOST=boltbet-db-host:latest,DB_NAME=boltbet-db-name:latest,DB_USER=boltbet-db-user:latest,DB_PASSWORD=boltbet-db-password:latest,REDIS_HOST=boltbet-redis-host:latest,REDIS_PASSWORD=boltbet-redis-password:latest,GOOGLE_OAUTH_CLIENT_ID=boltbet-google-oauth-client-id:latest,GOOGLE_OAUTH_CLIENT_SECRET=boltbet-google-oauth-client-secret:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
