substitutions:
  _REGION: europe-west2
  _REPO: vibe-apps
  _SERVICE: boltbet-backend-web
  _IMAGE: boltbet-backend
  _RUNTIME_SA: vibe-app-runtime@blockchain-gemini.iam.gserviceaccount.com
  # Dev deployment defaults. Override these for other environments.
  _CORS_ALLOWED_ORIGINS: https://boltbet-frontend-web.a.run.app
  _DB_HOST: /cloudsql/blockchain-gemini:europe-west2:boltbet-postgres-dev
  _DB_NAME: boltbet_dev
  _DB_USER: postgres
  _REDIS_HOST: 10.200.191.75

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        test -n "${_CORS_ALLOWED_ORIGINS}" || { echo "_CORS_ALLOWED_ORIGINS is required"; exit 1; }
        test -n "${_DB_HOST}" || { echo "_DB_HOST is required"; exit 1; }
        test -n "${_DB_NAME}" || { echo "_DB_NAME is required"; exit 1; }
        test -n "${_DB_USER}" || { echo "_DB_USER is required"; exit 1; }
        test -n "${_REDIS_HOST}" || { echo "_REDIS_HOST is required"; exit 1; }

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest
      - -f
      - Dockerfile
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_RUNTIME_SA}
      - --allow-unauthenticated
      - --port=8000
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=1
      - --set-env-vars=^@^DJANGO_ENV=production@DJANGO_BEHIND_PROXY=true@DJANGO_DEBUG=false@DJANGO_ALLOWED_HOSTS=*@CORS_ALLOWED_ORIGINS=${_CORS_ALLOWED_ORIGINS}@DB_HOST=${_DB_HOST}@DB_NAME=${_DB_NAME}@DB_USER=${_DB_USER}@REDIS_HOST=${_REDIS_HOST}@RUN_INGEST_IN_PROCESS=true@RUN_PURGE_IN_PROCESS=true@RUN_TRIM_IN_PROCESS=true@RUN_RESOLVER_IN_PROCESS=true
      - --set-secrets=DJANGO_SECRET_KEY=boltbet-django-secret-key:latest,OWM_API_KEY=boltbet-owm-api-key:latest,DB_PASSWORD=boltbet-db-password:latest,REDIS_PASSWORD=boltbet-redis-password:latest,GOOGLE_OAUTH_CLIENT_ID=boltbet-google-oauth-client-id:latest,GOOGLE_OAUTH_CLIENT_SECRET=boltbet-google-oauth-client-secret:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
